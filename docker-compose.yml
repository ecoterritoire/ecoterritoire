services:

  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoterritoire}
      POSTGRES_USER: ${POSTGRES_USER:-ecoterritoire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoterritoire}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoterritoire} -d ${POSTGRES_DB:-ecoterritoire}"]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-ecoterritoire}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-ecoterritoire}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-ecoterritoire}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-qualite-air}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-ecoterritoire-dev-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecoterritoire}:${POSTGRES_PASSWORD:-ecoterritoire}@db:5432/${POSTGRES_DB:-ecoterritoire}
      REDIS_URL: redis://redis:6379/0
      AUTH_CACHE_TTL_SECONDS: ${AUTH_CACHE_TTL_SECONDS:-60}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-ecoterritoire-dev-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ecoterritoire}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-qualite-air}
    depends_on:
      db:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  realtime-collector:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      REALTIME_SOURCE: ${REALTIME_SOURCE:-sensor_community}
      REALTIME_SOURCE_URL: ${REALTIME_SOURCE_URL:-https://data.sensor.community/airrohr/v1/filter/country=FR}
      REALTIME_SOURCE_TOKEN: ${REALTIME_SOURCE_TOKEN:-}
      REALTIME_POLL_INTERVAL_SECONDS: ${REALTIME_POLL_INTERVAL_SECONDS:-60}
      REALTIME_RETENTION_SECONDS: ${REALTIME_RETENTION_SECONDS:-900}
      REALTIME_BUFFER_SIZE: ${REALTIME_BUFFER_SIZE:-500}
    depends_on:
      redis:
        condition: service_healthy
    command: python -m script.realtime_collector

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    depends_on:
      - api

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  redis_data:
  