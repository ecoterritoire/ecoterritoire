services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoterritoire}
      POSTGRES_USER: ${POSTGRES_USER:-ecoterritoire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecoterritoire}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecoterritoire} -d ${POSTGRES_DB:-ecoterritoire}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecoterritoire}:${POSTGRES_PASSWORD:-ecoterritoire}@db:5432/${POSTGRES_DB:-ecoterritoire}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  